name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DMPC_BUILD_TESTS=ON
          -DMPC_BUILD_MPCGAIN=OFF
          -DMPC_BUILD_MPCCHAP=OFF

      - name: Build
        run: cmake --build build --config Release -j

      # C unit tests run everywhere; the shell-based integration/fuzz/fixture
      # suites (bash + python3) are UNIX-only.
      - name: Test (unit)
        run: ctest --test-dir build -C Release -R "^unit$" --output-on-failure

      - name: Test (integration + fuzz + fixtures)
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build -C Release -E "^unit$" --output-on-failure
