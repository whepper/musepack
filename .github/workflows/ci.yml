name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to build the reference encoder at 05d97a5

      - name: Configure
        run: >
          cmake -S . -B build
          -DMPC_BUILD_TESTS=ON
          -DMPC_BUILD_MPCGAIN=OFF
          -DMPC_BUILD_MPCCHAP=OFF

      - name: Build
        run: cmake --build build --config Release -j

      # C unit tests run everywhere; the shell-based integration/fuzz/fixture
      # suites (bash + python3) are UNIX-only.
      - name: Test (unit)
        run: ctest --test-dir build -C Release -R "^unit$" --output-on-failure

      - name: Test (integration + fuzz + fixtures)
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build -C Release -E "^unit$|^compat$" --output-on-failure

      # Build the pristine reference encoder (05d97a5) and verify the built
      # encoder is byte-identical to it. Runs on all platforms: the live
      # comparison is toolchain-agnostic (the committed -O0 manifest is only a
      # local fallback). Unix: patch the reference's hardcoded -O3 CFLAGS to
      # match the main build's default (-O0). Windows: both use --config
      # Release (/O2).
      - name: Checkout reference encoder
        shell: bash
        run: git worktree add --detach "$RUNNER_TEMP/musepack-ref" 05d97a5

      - name: Configure reference encoder
        shell: bash
        run: |
          # Keep only the encoder targets (libmpcpsy/libmpcenc/mpcenc): the
          # pristine tree cannot configure otherwise (mpcgain/mpcchap need
          # external libs; mpcdec/mpc2sv8/mpccut declare duplicate targets
          # under MSVC). Also aligns -O3 to -O0 and downgrades
          # -Wincompatible-pointer-types (an error on GCC 14+).
          PY="$(command -v python3 || command -v python)"
          "$PY" "$GITHUB_WORKSPACE/tests/patch_reference.py" "$RUNNER_TEMP/musepack-ref"
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -S "$RUNNER_TEMP/musepack-ref" -B "$RUNNER_TEMP/ref-build"

      - name: Build reference encoder
        run: cmake --build "$RUNNER_TEMP/ref-build" --config Release -j --target mpcenc

      - name: Test (compat)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            REF_MPCENC="$(cygpath -u "$RUNNER_TEMP")/ref-build/mpcenc/mpcenc.exe"
          else
            REF_MPCENC="$RUNNER_TEMP/ref-build/mpcenc/mpcenc"
          fi
          export REF_MPCENC
          ctest --test-dir build -C Release -R "^compat$" --output-on-failure
