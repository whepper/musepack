<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>libmusepack WASM playback demo</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  button { font: inherit; padding: 6px 14px; }
  input[type=range] { width: 100%; }
  .row { margin: 12px 0; }
  #info { font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-line; }
  #status { color: #666; }
</style>
</head>
<body>
<h1>libmusepack — WASM playback</h1>

<div class="row">
  <input type="file" id="file" accept=".mpc">
  <button id="play" disabled>Play</button>
  <button id="stop" disabled>Stop</button>
</div>

<div class="row">
  <input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled>
  <div id="time">0:00 / 0:00</div>
</div>

<div id="info"></div>
<div id="status">Choose a .mpc file to begin.</div>

<script src="main.js"></script>
</body>
</html>
